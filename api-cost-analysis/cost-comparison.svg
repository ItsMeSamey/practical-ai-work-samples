<svg xmlns="http://www.w3.org/2000/svg" width="551" height="513" viewBox="0 0 551 513">
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="25" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">API price comparisons: three accounting traps</text>
<text x="24" y="44" fill="#596977" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">USD | 16 Oct 2026 | Compare bars within each panel; scales differ.</text>
<text x="24" y="72" fill="#087f8c" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">01  TOKENIZER</text>
<text x="24" y="93" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">Same input text can become more billable tokens.</text>
<text x="24" y="120" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Sonnet 4.6 reference</text>
<rect x="254" y="110" width="225.0" height="13" fill="#ccd7dc"/>
<text x="486" y="120" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$3.00</text>
<text x="24" y="143" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Sonnet 5.5, same token count</text>
<rect x="254" y="133" width="150.0" height="13" fill="#087f8c"/>
<text x="486" y="143" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$2.00</text>
<text x="24" y="166" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Sonnet 5.5, assumed +30% tokens</text>
<rect x="254" y="156" width="195.0" height="13" fill="#b85b31"/>
<text x="486" y="166" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$2.60</text>
<text x="24" y="192" fill="#596977" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Hypothetical: 1M old input tokens; 33.3% lower unit price, 13.3% lower cost.</text>
<line x1="24" y1="208" x2="527" y2="208" stroke="#ccd7dc"/>
<text x="24" y="233" fill="#087f8c" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">02  EFFECTIVE DATE</text>
<text x="24" y="254" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">Gemini 4 Argon: the effective date changes the cost.</text>
<text x="24" y="281" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Argon, through Nov 30</text>
<rect x="254" y="271" width="112.5" height="13" fill="#087f8c"/>
<text x="486" y="281" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$4.00</text>
<text x="24" y="306" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Argon, scheduled from Dec 1</text>
<rect x="254" y="296" width="225.0" height="13" fill="#b85b31"/>
<text x="486" y="306" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$8.00</text>
<text x="24" y="332" fill="#596977" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">1M input + 0.2M billable output tokens, aggregated across requests.</text>
<line x1="24" y1="348" x2="527" y2="348" stroke="#ccd7dc"/>
<text x="24" y="373" fill="#087f8c" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">03  OUTPUT MIX</text>
<text x="24" y="394" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">Gemini 3.5 Flash-Lite: output can dominate.</text>
<text x="24" y="421" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Flash-Lite, input charge only</text>
<rect x="254" y="411" width="84.375" height="13" fill="#ccd7dc"/>
<text x="486" y="421" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$0.30</text>
<text x="24" y="446" fill="#14232e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Flash-Lite, input + output</text>
<rect x="254" y="436" width="84.375" height="13" fill="#087f8c"/>
<rect x="338.375" y="436" width="140.625" height="13" fill="#b85b31"/>
<text x="486" y="446" fill="#b85b31" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700">$0.80</text>
<text x="24" y="473" fill="#596977" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400">Same aggregate mix as case 02; output contributes $0.50, or 62.5%.</text>
<text x="24" y="503" fill="#596977" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="400">Sources: Anthropic and Google pricing docs. Method and CSVs accompany the chart.</text>
</svg>